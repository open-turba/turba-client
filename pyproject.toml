[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turba-client"
version = "0.1.0"
description = "Turba Client is a Python client for querying publicly accessible soil profile and fertilizer recommendation workflows across Morocco."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Turba Open Lab"}
]
keywords = ["agriculture", "soil fertility", "fertilizer", "site-specific", "npk recommendations", "morocco"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "beautifulsoup4>=4.12",
  "pandas>=1.5",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[project.urls]
Homepage = "https://github.com/open-turba/turba-client"
Repository = "https://github.com/open-turba/turba-client"
Issues = "https://github.com/open-turba/turba-client/issues"

[project.scripts]
turba-client = "turba_client.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
turba_client = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -p no:cacheprovider"
testpaths = ["tests"]
